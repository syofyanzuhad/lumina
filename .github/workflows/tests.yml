name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Verify tracker bundle is reproducible from source
        # The checked-in public/js/script.js must be byte-identical to a fresh
        # terser build so the tracker is reproducible and TrackerScriptSizeTest
        # always reflects the committed artifact.
        run: |
          npm run build:tracker
          git diff --exit-code -- public/js/script.js

      - name: Run CI Checks
        run: composer ci:check
